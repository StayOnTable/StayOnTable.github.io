name: Bootstrap verified site source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository_owner == 'StayOnTable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and restore the public source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/site.tar.gz.b64 > /tmp/site.tar.gz
          echo "c2a68e3d67389e764c3889cb05c03a848eeb796b1e7be1a354688d1b8a6a6fee  /tmp/site.tar.gz" | sha256sum --check -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/site.tar.gz -C .

      - name: Publish the verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified StayOnTable personal site"
          git push origin HEAD:main

# Retry after the Pages workflow was seeded through the authenticated UI.
